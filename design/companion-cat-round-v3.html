<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圆润蓝眼小黑猫</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #302c35; font-family: "Microsoft YaHei", sans-serif; background: radial-gradient(circle at 50% -10%, #fff 0 25%, transparent 58%), #eadfe3; }
    main { width: min(1370px, calc(100% - 52px)); margin: auto; padding: 48px 0 60px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 39px; letter-spacing: -.04em; }
    header p { margin: 8px 0 0; color: #746a74; font-size: 17px; }
    .note { flex: none; padding: 10px 16px; border: 1px solid #ccb9c3; border-radius: 999px; color: #786571; background: #fff9; }
    .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    article { padding: 18px; border: 1px solid #cdbdc4; border-radius: 30px; background: rgb(255 252 253 / 86%); box-shadow: 0 20px 50px rgb(75 49 63 / 10%); }
    .device { padding: 22px 22px 18px; border: 2px solid #977389; border-radius: 42px; background: linear-gradient(145deg, #dab1ca, #c99ab8); box-shadow: inset 0 -8px 0 rgb(106 64 90 / 12%); }
    .brand { display: flex; justify-content: space-between; padding: 0 8px 12px; color: #715367; font: 700 11px ui-monospace, monospace; letter-spacing: .14em; }
    .frame { padding: 12px; border: 7px solid #5d5960; border-radius: 25px; background: #777178; box-shadow: inset 0 0 0 3px #3c3a3e; }
    .screen { position: relative; aspect-ratio: 1.16; overflow: hidden; border-radius: 10px; background: #b8c9ad; box-shadow: inset 0 0 20px rgb(45 65 46 / 18%); }
    .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .12; background: repeating-linear-gradient(0deg, transparent 0 3px, #486047 3px 4px); }
    .status { position: absolute; z-index: 3; inset: 8px 10px auto; display: flex; justify-content: space-between; color: #26352d; font: 700 11px ui-monospace, monospace; }
    svg { display: block; width: 88%; height: 84%; margin: 8% auto; overflow: visible; }
    .fur { fill: #272b33; }
    .fur-soft { fill: #3e4857; }
    .tail { fill: none; stroke: #272b33; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .iris { fill: #72c8f4; }
    .pupil { fill: #102638; }
    .glint { fill: #f7fdff; }
    .nose { fill: #a8c2d2; }
    .mouth { fill: none; stroke: #e9edf0; stroke-width: 1.8; stroke-linecap: round; }
    .paw-line { fill: none; stroke: #667485; stroke-width: 1.6; stroke-linecap: round; }
    .spark { fill: #eff7e5; opacity: .8; }
    .buttons { display: flex; justify-content: center; gap: 34px; padding-top: 17px; }
    .buttons i { width: 54px; height: 22px; border: 2px solid #947087; border-radius: 50%; background: linear-gradient(#f9e5ef, #ddb3c9); box-shadow: 0 5px 0 #8e6981; }
    .copy { padding: 20px 7px 4px; }
    .copy small { color: #a17b91; font: 800 11px ui-monospace, monospace; letter-spacing: .14em; }
    .copy h2 { margin: 7px 0 6px; font-size: 24px; }
    .copy p { margin: 0; color: #786e76; line-height: 1.6; }
    @media (max-width: 900px) { main { width: min(520px, calc(100% - 28px)); padding-top: 30px; } header { align-items: start; flex-direction: column; } .states { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
    <header><div><h1>圆润蓝眼小黑猫</h1><p>同一只猫的三个状态：圆形轮廓、豆子身体、连续卷尾和椭圆蓝眼。</p></div><span class="note">软像素候选 · 尚未接入</span></header>
    <section class="states">
        <article>
            <div class="device"><div class="brand"><span>POCKET CAT</span><span>IDLE</span></div><div class="frame"><div class="screen"><div class="status"><span>HOME</span><span>好奇 ●●●</span></div>
                <svg viewBox="0 0 100 82" aria-label="圆润小黑猫待机">
                    <path class="tail" d="M69 58c19 1 23-14 18-25-3-7-10-7-13-2"/>
                    <ellipse class="fur" cx="51" cy="59" rx="25" ry="17"/>
                    <path class="fur" d="M24 28c0-10 6-16 12-18l5-8 7 9c5-1 10 0 14 1l8-8 2 14c5 5 7 11 7 18 0 15-11 23-29 23S21 50 21 36c0-3 1-6 3-8z"/>
                    <path class="fur-soft" d="M37 11l4-6 4 9zM64 13l5-6 1 10z"/>
                    <ellipse class="iris" cx="39" cy="31" rx="8" ry="11"/><ellipse class="iris" cx="58" cy="31" rx="8" ry="11"/>
                    <ellipse class="pupil" cx="40" cy="33" rx="4" ry="7"/><ellipse class="pupil" cx="59" cy="33" rx="4" ry="7"/>
                    <circle class="glint" cx="37" cy="27" r="2.5"/><circle class="glint" cx="56" cy="27" r="2.5"/>
                    <path class="nose" d="M47 42h6l-3 4z"/><path class="mouth" d="M50 46c-1 4-5 4-6 1m6-1c1 4 5 4 6 1"/>
                    <ellipse class="fur-soft" cx="39" cy="66" rx="9" ry="5"/><ellipse class="fur-soft" cx="59" cy="66" rx="9" ry="5"/>
                    <path class="paw-line" d="M40 64v4m18-4v4"/>
                </svg>
            </div></div><div class="buttons"><i></i><i></i><i></i></div></div>
            <div class="copy"><small>STATE 01 · IDLE</small><h2>安静待机</h2><p>脑袋、身体和爪子全部使用圆形关系，不再像几何图标。</p></div>
        </article>
        <article>
            <div class="device"><div class="brand"><span>POCKET CAT</span><span>PET</span></div><div class="frame"><div class="screen"><div class="status"><span>PET</span><span>开心 ♥♥♥</span></div>
                <svg viewBox="0 0 100 82" aria-label="圆润小黑猫被摸">
                    <path class="tail" d="M70 58c17 2 25-10 21-20-2-6-8-7-12-3"/>
                    <ellipse class="fur" cx="51" cy="59" rx="25" ry="17"/>
                    <g transform="rotate(-5 49 35)">
                        <path class="fur" d="M24 28c0-10 6-16 12-18l5-8 7 9c5-1 10 0 14 1l8-8 2 14c5 5 7 11 7 18 0 15-11 23-29 23S21 50 21 36c0-3 1-6 3-8z"/>
                        <path class="fur-soft" d="M37 11l4-6 4 9zM64 13l5-6 1 10z"/>
                        <path class="mouth" d="M33 33c3-6 8-6 11 0m10 0c3-6 8-6 11 0"/>
                        <path class="nose" d="M47 41h6l-3 4z"/><path class="mouth" d="M50 45c-1 5-6 5-7 1m7-1c1 5 6 5 7 1"/>
                    </g>
                    <ellipse class="fur-soft" cx="39" cy="66" rx="9" ry="5"/><ellipse class="fur-soft" cx="59" cy="66" rx="9" ry="5"/>
                    <path class="paw-line" d="M40 64v4m18-4v4"/>
                    <path class="spark" d="M15 23h3v5h5v3h-5v5h-3v-5h-5v-3h5zM79 16h2v4h4v2h-4v4h-2v-4h-4v-2h4z"/>
                </svg>
            </div></div><div class="buttons"><i></i><i></i><i></i></div></div>
            <div class="copy"><small>STATE 02 · PET</small><h2>被摸摸</h2><p>开心时脑袋会倾斜，耳朵、闭眼和尾巴共同表达反应。</p></div>
        </article>
        <article>
            <div class="device"><div class="brand"><span>POCKET CAT</span><span>REST</span></div><div class="frame"><div class="screen"><div class="status"><span>REST</span><span>安心 ◐</span></div>
                <svg viewBox="0 0 100 82" aria-label="圆润小黑猫团成一团">
                    <path class="tail" d="M72 61c15-2 17-16 10-23-6-7-15-3-15 5"/>
                    <ellipse class="fur" cx="51" cy="57" rx="31" ry="20"/>
                    <path class="fur" d="M20 39c0-10 6-17 14-20l5-8 7 7c6-1 11 0 15 1l8-7 2 13c6 4 9 10 9 17 0 11-10 18-30 18S20 51 20 39z"/>
                    <path class="fur-soft" d="M35 20l4-6 4 8zM63 20l5-5 1 9z"/>
                    <path class="mouth" d="M31 36c3-5 8-5 11 0m11 0c3-5 8-5 11 0"/>
                    <path class="nose" d="M45 43h6l-3 4z"/><path class="mouth" d="M48 47c-1 4-5 4-6 1m6-1c1 4 5 4 6 1"/>
                    <ellipse class="fur-soft" cx="59" cy="62" rx="14" ry="6"/><path class="paw-line" d="M54 61c4 2 8 2 12 0"/>
                    <text x="78" y="28" fill="#42524a" font-size="10" font-family="monospace">z</text><text x="86" y="20" fill="#42524a" font-size="8" font-family="monospace">z</text>
                </svg>
            </div></div><div class="buttons"><i></i><i></i><i></i></div></div>
            <div class="copy"><small>STATE 03 · REST</small><h2>团成一团</h2><p>休息时压低头身并收起爪子，整体变成一颗有尾巴的黑豆。</p></div>
        </article>
    </section>
</main>
</body>
</html>
